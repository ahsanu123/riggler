[package]
name = "riggler"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
name = "riggler_lib"

[[bin]]
path = "src/main.rs"
name = "riggler"

[features]
debug = []

[dependencies]
riggler_shared = { path = "../shared" }
slint = { version = "1.13", features = ["backend-android-activity-06"] }
tray-item = { version = "0.10.0", optional = true }
gtk = { version = "0.18", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dirs = "6.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.10.0", features = ["libappindicator"]}
gtk = { version = "0.18" }

[target.'cfg(target_os = "windows")'.dependencies]
tray-item = { version = "0.10.0" }

# [target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen = { version = "0.2" }
# console_error_panic_hook = "0.1.5"

[build-dependencies]
slint-build = { version = "1.13"  }
embed-resource = "3.0.6"

[package.metadata.android]
package = "ah.ah.riggler"
apk_name = "riggler"

[package.metadata.android.application]
label = "Riggler - Dead Simple Mouse Jiggler in Rust."
